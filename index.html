<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Deck</title>
  <link rel="stylesheet" href="./dist/output.css">
</head>
<body class="font-body text-ink">

  <!-- ===================== EN-TÊTE ===================== -->
  <header class="backdrop-blur-lg bg-[#0b0f15]/70 text-white">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-8 py-5 relative">
    
    <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-brand">
<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-yellow-600 flex items-center justify-center shadow-md">
  <svg aria-hidden="true" class="h-6 w-6 text-white stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path>
    <path d="M13 19l6-6"></path>
    <path d="M16 16l4 4"></path>
    <path d="M19 21l2-2"></path>
    <path d="M9.5 17.5L21 6V3h-3L6.5 14.5"></path>
    <path d="M11 19l-6-6"></path>
    <path d="M8 16l-4 4"></path>
    <path d="M5 21l-2-2"></path>
  </svg>
</div>   </div>
      <div>
        <p class="font-display text-2xl font-extrabold leading-none">My Deck</p>
        <p class="text-sm text-gray-300">Yu-Gi-Oh! · <span id="cards-count">12</span> cards</p>
      </div>
    </div>

    <div class="relative flex items-center lg:hidden">
      <input type="checkbox" id="menu-toggle" class="peer hidden" />
      
      <label for="menu-toggle" class="cursor-pointer p-2 text-white hover:text-brand transition-colors">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </label>

      <nav class="hidden peer-checked:flex flex-col absolute top-full right-0 z-50 w-64 bg-ink border-2 border-white/10 shadow-xl p-4 space-y-3 rounded-2xl mt-2">
        <a href="#Ccards" class="rounded-full bg-white/10 px-4 py-2 text-center text-white">Cards</a>
        <a href="#mycards" class="rounded-full bg-white/10 px-4 py-2 text-center text-white">My Deck · <span class="team-count">0</span>/6</a>
        <a href="#create" class="rounded-full bg-white px-4 py-2 font-bold text-ink text-center">+ New Cards</a>
      </nav>
    </div>

    <nav aria-label="Navigation principale" class="hidden lg:flex flex-wrap gap-2 items-center">
      <a href="#Ccards" class="rounded-full bg-white/10 px-4 py-2">Cards</a>
      <a href="#mycards" class="rounded-full bg-white/10 px-4 py-2">My Deck · <span class="team-count">0</span>/6</a>
      <a href="#create" class="rounded-full bg-white px-4 py-2 font-bold text-ink">+ New Cards</a>
    </nav>

  </div>
</header>

  <main class="mx-auto flex max-w-7xl flex-col gap-8 px-8 py-8">

    <!-- ===================== RECHERCHE ET FILTRES ET SORT ===================== -->
    <section aria-label="Recherche et filtres" class="flex flex-col gap-4 md:ml-31">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <h1 class="font-display text-3xl font-extrabold text-white">Choose your cards</h1>
        <label class="flex w-full max-w-md flex-col gap-1 text-sm text-white font-bold">
          Search by name
          <input id="search" type="search" placeholder="ex. Mossling" class="field font-normal bg-[#12161c] text-white border border-gray-700">
        </label>
      </div>

      <div id="filters" role="group" aria-label="Filtrer par type" class=" flex gap-3">
  

        <div class="block w-full md:w-113">
          <select id="filter" class="field w-full font-normal bg-[#12161c] text-white border border-gray-700">
          <option value="Tous">All Types</option>
          <option value="Effect">Effect</option>
          <option value="LIGHT">LIGHT</option>
          <option value="Fusion">Fusion</option>
          <option value="DARK">DARK</option>
          <option value="EARTH">EARTH</option>
          <option value="WATER">WATER</option>
          </select>
        </div>
        <div class="sort block w-full md:w-113">
          <select id="sort" class="field w-full font-normal bg-[#12161c] text-white border border-gray-700">
            <option value="id">Sort By ID</option>
            <option value="level">Sort By Level</option>
            <option value="attack">Sort By Attack</option>
            <option value="defence">Sort By Defence</option>
          </select>
        </div>


  

</div>
    </section>

    <div class="flex flex-col lg:flex-row gap-8 items-start">

      <!-- ===================== GRILLE DES CRÉATURES ===================== -->
      <section id="Ccards" aria-label="Créatures" class="grid min-w-0 flex-1 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-5 mx-auto">

       
       
      </section>

      <aside class="flex w[350] md:w-[420px] shrink-0 flex-col gap-6 mx-auto">

        <!-- ===================== PANNEAU DE DÉTAIL ===================== -->
        <div id="dcard" class="hidden lg:block">
        
        </div>

        <!-- ===================== MON ÉQUIPE (INCOMPLÈTE) ===================== -->
        <section aria-label="My cards" class="relative flex flex-col gap-3 rounded-2xl p-4 border border-gray-800 shadow-2xl bg-[#12161c] bg-cover bg-center" style="background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('images/bg.png')">
        <h2 class="font-display text-2xl font-extrabold text-white">My Deck <span>(<span class="team-count">0</span>/6</span>)</h2>
          <div id="mycards" class="grid lg:grid-cols-2 md:grid-cols-2 grid-cols-1  gap-3">
            
             
          </div>
        </section>

      </aside>
    </div>

    <!-- ===================== FORMULAIRE DE CRÉATION ===================== -->
    <div class="lg:flex gap-8">
    <section id="create" aria-label="Nouvelle créature" class="flex flex-col gap-6 rounded-card bg-[#0b0f15]/95 backdrop-blur-md p-8 w-79 md:w-150 mx-auto lg:w-full">
      <div>
        <h2 class="font-display text-3xl font-extrabold text-white">New Card</h2>
      </div>
      <form id="creature-form" novalidate class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-4">
        <label class="flex flex-col gap-1 text-sm font-bold text-white">Numéro
          <input name="id" type="text" placeholder="#010" class="field font-normal bg-black/50 border border-gray-700">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-white">Nom
          <input name="name" type="text" placeholder="Card Name" class="field font-normal bg-black/50 border border-gray-700">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-white">Type
          <select name="type" class="field font-normal bg-black/50 border border-gray-700">
            <option value="Tous">All Types</option>
            <option value="Effect">Effect</option>
            <option value="LIGHT">LIGHT</option>
            <option value="Fusion">Fusion</option>
            <option value="DARK">DARK</option>
            <option value="EARTH">EARTH</option>
            <option value="WATER">WATER</option>
          </select>
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-white">Level
          <input name="level" type="text" placeholder="Base, Level 1…" class="field font-normal bg-black/50 border border-gray-700">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-white">Attack
          <input name="attack" type="text" placeholder="0 to 5000" class="field font-normal bg-black/50 border border-gray-700">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-white">Defence
          <input name="defence" type="text" placeholder="0 to 5000" class="field font-normal bg-black/50 border border-gray-700">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-white">Image Link
          <input name="image" type="text" placeholder="https://…/image.png" class="field font-normal bg-black/50 border border-gray-700">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold md:col-span-2 lg:col-span-4 text-white">Description
          <textarea name="description" rows="3" placeholder="10 to 200 characters" class="rounded-xl p-3 font-normal outline-none bg-black/50 border border-gray-700"></textarea>
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <div class="flex flex-wrap justify-center gap-3 md:col-span-2 lg:col-span-4">
          <button type="reset" class="btn-outline px-6 cursor-pointer">Delete</button>
          <button type="submit" class="btn-primary cursor-pointer">Add card</button>
        </div>
      </form>
    </section>

    <!-- ===================== Random Card ===================== -->
    <div class="flex flex-col gap-5">
    <section class="flex flex-col gap-6 rounded-card bg-[#0b0f15]/95 backdrop-blur-md p-8 w-79 md:w-150 mx-auto lg:w-106 lg:h-50">
      <h2 class="font-display text-3xl font-extrabold text-white">Random Card</h2>
      <button id="rollbtn" type="button" class="btn-primary cursor-pointer">Roll</button>
    </section>

    <!-- ===================== Random Card ===================== -->
    <section class="flex flex-col gap-6 rounded-card bg-[#0b0f15]/95 backdrop-blur-md p-8 w-79 md:w-150 mx-auto lg:w-106 lg:h-50">
      <h2 class="font-display text-3xl font-extrabold text-white">Data Rest</h2>
      <button id="resetbtn" type="button" class="btn-primary cursor-pointer">Rest</button>
    </section>
    </div>
  </div>
  </main>

  <footer class="w-full text-sm text-muted text-white text-center backdrop-blur-lg bg-[#0b0f15]/70 p-4">
    Images : ygoprodeck.com. Fan project created as part of a training program.
  </footer>

  <!-- data.js (à créer) doit être chargé AVANT script.js -->
  <script src="./data.js"></script>
  <script src="./main.js"></script>
</body>
</html>
